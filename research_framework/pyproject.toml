[project]
name = "research-framework"
version = "0.1.0"
description = "Autonomous Research Agent Framework based on Antigravity patterns"
authors = [{ name = "Nguyen Manh" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "google-genai>=0.2.0",
    "rich>=13.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
nexus = "research_framework.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
